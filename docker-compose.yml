services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      ADSS_BASE_URL: ${ADSS_BASE_URL:-https://ai-scope.cbpf.br}
      # Credentials used to obtain a fresh token for the daily calendar runner.
      ADSS_SERVICE_USERNAME: ${ADSS_SERVICE_USERNAME:-}
      ADSS_SERVICE_PASSWORD: ${ADSS_SERVICE_PASSWORD:-}
      CALENDAR_CACHE_LOOKBACK_DAYS: ${CALENDAR_CACHE_LOOKBACK_DAYS:-370}
      # JSONL samples written by the Arandu monitor. Override this path when
      # using a differently named mount in another deployment.
      MONITOR_HISTORY_PATH: ${MONITOR_HISTORY_PATH:-/monitor-data/monitor-history.jsonl}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Nginx gives production a same-origin API. This is only relevant when
      # connecting directly to the API in development.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    expose:
      - "8000"
    volumes:
      # Read docs from the checkout so edits are immediately reflected by the API.
      - ./docs:/app/docs:ro
      - /home/schwarz/arandu/data/monitor-history.jsonl:/monitor-data/monitor-history.jsonl:ro

  nginx:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5001:80"
    volumes:
      # Cutout PNGs are produced outside this checkout.  Mount them read-only
      # so Nginx can serve them without sending each image through the API.
      - /home/astrodados4/arandu/data/cutouts:/usr/share/nginx/cutouts:ro
