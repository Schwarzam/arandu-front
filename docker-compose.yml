services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      ADSS_BASE_URL: ${ADSS_BASE_URL:-https://ai-scope.cbpf.br}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Nginx gives production a same-origin API. This is only relevant when
      # connecting directly to the API in development.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    expose:
      - "8000"

  nginx:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5001:80"
