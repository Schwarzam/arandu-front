server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The browser has a single origin: Nginx serves the UI and proxies API
    # calls, so the browser has a single origin.
    #
    # Cutout FITS files are arranged as
    # <dia_source_id>/<science|template|difference>.fits.  Keep this location
    # ahead of the SPA fallback so requests never reach FastAPI.
    location ^~ /cutouts/ {
        alias /usr/share/nginx/cutouts/;
        autoindex off;
        limit_except GET HEAD { deny all; }
        expires 1d;
        add_header Cache-Control "private, max-age=86400";
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Preserve HTTPS when TLS terminates at the proxy in front of Nginx.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 90s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
