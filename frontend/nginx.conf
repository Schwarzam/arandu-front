server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The browser has a single origin: Nginx serves the UI and proxies API
    # calls, so the secure session cookie remains same-site.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Preserve HTTPS when TLS terminates at the proxy in front of Nginx.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # A cutout can require an ADSS lookup and a remote FITS download.
        proxy_read_timeout 90s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
